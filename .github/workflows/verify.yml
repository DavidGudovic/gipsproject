name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run verify
      - name: Require committed generated pages and assets
        run: |
          git diff --exit-code -- index.html en/ assets/ sitemap.xml
          test -z "$(git ls-files --others --exclude-standard -- index.html en/ assets/ sitemap.xml)"
      - name: Assemble the public-only site
        run: node scripts/publish.mjs
