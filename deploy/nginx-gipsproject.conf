# Proposed /etc/nginx/sites-available/gipsproject.me. Test with nginx -t before reloading.
server {
    listen 80;
    server_name gipsproject.me www.gipsproject.me;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://gipsproject.me$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name www.gipsproject.me;
    ssl_certificate /etc/letsencrypt/live/gipsproject.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gipsproject.me/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    return 301 https://gipsproject.me$request_uri;
}

server {
    listen 443 ssl http2;
    server_name gipsproject.me;
    root /var/www/html/gipsproject.me;
    index index.html;
    autoindex off;

    ssl_certificate /etc/letsencrypt/live/gipsproject.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gipsproject.me/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    expires -1;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain text/xml application/xml;

    location ~ /\.(?!well-known(?:/|$)) { return 404; }
    location ~ ^/(?:node_modules|resources|scripts|templates|css|locales|content|deploy)(?:/|$) { return 404; }
    location ~ ^/(?:package(?:-lock)?\.json|CLAUDE\.md|WEBSITE\.md|DEPLOYMENT\.md)$ { return 404; }

    location = / {
        if ($arg_lang = en) { return 301 https://gipsproject.me/en/; }
        try_files /index.html =404;
    }
    location = /index.html { return 301 /$is_args$args; }
    location = /en/index.html { return 301 /en/$is_args$args; }
    location / { try_files $uri $uri/ =404; }
    location ~* \.(?:css|js|woff2?|ttf|svg|png|jpe?g|webp|avif|ico)$ {
        try_files $uri =404;
        expires 7d;
    }
}
